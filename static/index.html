<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sniper Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0e11; color: #eaeaea; padding: 20px; }
        h2 { color: #f0b90b; display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; background: #1e2329; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #2b3139; }
        th { background: #2b3139; color: #848e9c; text-transform: uppercase; font-size: 12px; }
        .BUY { color: #02c076; font-weight: bold; background: rgba(2, 192, 118, 0.1); }
        .SKIP { color: #f0b90b; background: rgba(240, 185, 11, 0.1); }
        .INFO { color: #848e9c; }
        .SCAN { color: #474d57; }
        .price-up { color: #02c076; transition: 0.3s; }
        .price-down { color: #f84960; transition: 0.3s; }
    </style>
</head>
<body>
    <h2>🎯 Sniper Volatility V2 | Modo Local</h2>
    <div id="dashboard">Cargando monitor...</div>

    <script>
        let prevPrices = {};

        async function updateData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                let html = '<table><tr><th>Par</th><th>Precio Actual</th><th>Vol Rel</th><th>Estado / Señal</th></tr>';

                data.forEach(item => {
                    const pClass = prevPrices[item.pair] < item.price ? 'price-up' : (prevPrices[item.pair] > item.price ? 'price-down' : '');
                    prevPrices[item.pair] = item.price;

                    html += `<tr>
                                <td><strong>${item.pair}</strong></td>
                                <td class="${pClass}">${item.price.toFixed(8)}</td>
                                <td>${item.vol.toFixed(2)}x</td>
                                <td class="${item.type}">${item.alert}</td>
                             </tr>`;
                });
                document.getElementById('dashboard').innerHTML = html + '</table>';
            } catch (e) { console.error("Error de conexión", e); }
        }

        setInterval(updateData, 1000);
        updateData();
    </script>
</body>
</html>

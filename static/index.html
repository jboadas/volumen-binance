<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; background: #0b0e11; color: #eaeaea; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: #1e2329; border-radius: 4px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2b3139; }
        .BUY { color: #02c076; font-weight: bold; background: rgba(2, 192, 118, 0.1); }
        .SKIP { color: #f0b90b; }
        .up { color: #02c076; }
        .down { color: #f84960; }
    </style>
</head>
<body>
    <h2>🚀 Sniper Volatility V2 | Monitor Local</h2>
    <div id="dashboard">Cargando...</div>

    <script>
        let prices = {};
        async function update() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                let html = '<table><tr><th>PAR</th><th>PRECIO</th><th>VOL REL</th><th>ESTADO</th></tr>';
                data.forEach(i => {
                    const cls = prices[i.pair] < i.price ? 'up' : (prices[i.pair] > i.price ? 'down' : '');
                    prices[i.pair] = i.price;
                    html += `<tr><td>${i.pair}</td><td class="${cls}">${i.price.toFixed(8)}</td>
                             <td>${i.vol.toFixed(4)}x</td><td class="${i.type}">${i.alert}</td></tr>`;
                });
                document.getElementById('dashboard').innerHTML = html + '</table>';
            } catch (e) {}
        }
        setInterval(update, 1000);
    </script>
</body>
</html>

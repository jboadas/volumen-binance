<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sniper Scalper - Ruptura 1H</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; font-family: 'Courier New', Courier, monospace; }
        .stat-card { border: 1px solid #1e293b; background: #0f172a; }
    </style>
</head>
<body class="text-slate-300 p-6">
    <div class="max-w-3xl mx-auto">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-8">
            <h1 class="text-xl font-bold text-white uppercase tracking-tighter">🎯 Sniper_Volatility_v2</h1>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-xs text-green-500 font-bold uppercase">Socket Active</span>
            </div>
        </header>

        <div class="grid grid-cols-2 gap-4">
            <div class="stat-card p-6 rounded shadow-xl">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Grind Ticks</h3>
                <p class="text-4xl font-black text-white mt-1">{{ ticks }}</p>
            </div>
            <div class="stat-card p-6 rounded shadow-xl">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Alertas 1h</h3>
                <p class="text-4xl font-black text-yellow-500 mt-1">{{ alerts }}</p>
            </div>
        </div>

        <div class="mt-8 bg-black p-4 border border-slate-800 text-xs">
            <p class="text-slate-500">SYSTEM_LOG:</p>
            <p class="mt-2 text-blue-400">> Firewall activo en MX Linux</p>
            <p class="text-green-400">> Monitorizando ruptura de rangos (Volatility Breakout)</p>
            <p class="text-slate-400">> Redis persistence: OK</p>
        </div>
    </div>
    <script>
        // Refresco cada 3 segundos para no saturar
        setTimeout(() => { location.reload(); }, 3000);
    </script>
</body>
</html>

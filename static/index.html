<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroScanner Crypto Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12141c;
            color: #e2e8f0;
            padding: 10px;
            line-height: 1.3;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #2d3748;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 18px;
            color: #f7fafc;
            font-weight: 600;
        }

        .wallet-panel {
            background: #1a202c;
            border: 1px solid #2d3748;
            padding: 6px 15px;
            border-radius: 6px;
            display: flex;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .wallet-metric {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 10px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1px;
        }

        .wallet-metric .metric-value {
            font-size: 15px;
            font-weight: bold;
        }

        .value-neutral {
            color: #f7fafc;
        }

        .value-positive {
            color: #38a169;
        }

        .value-negative {
            color: #e53e3e;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1.5fr 1fr;
            }
        }

        .panel {
            background: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .table-wrapper {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #2d3748;
            border-radius: 4px;
            background: #171e29;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 5px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #1a202c;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 2px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 11px;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #1a202c;
            z-index: 2;
            box-shadow: inset 0 -1px 0 #2d3748;
        }

        th {
            color: #a0aec0;
            font-weight: 500;
            padding: 6px 5px;
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 5px 5px;
            border-bottom: 1px solid #2d3748;
            color: #cbd5e0;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #212936;
        }

        .pnl-neutral {
            color: #cbd5e0;
        }

        .pnl-positive {
            color: #48bb78;
            font-weight: 600;
        }

        .row-high-risk {
            background-color: rgba(229, 62, 62, 0.10) !important;
            animation: pulse-border 2s infinite ease-in-out;
        }

        .pnl-high-risk {
            color: #f56565 !important;
            font-weight: bold;
        }

        .badge-risk {
            background-color: #e53e3e;
            color: white;
            padding: 1px 3px;
            border-radius: 2px;
            font-size: 8px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 3px;
            display: inline-block;
        }

        .market-badge {
            background: #2d3748;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10px;
            color: #edf2f7;
            font-weight: 600;
        }

        .btn-action {
            padding: 2px 6px;
            border: none;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .btn-buy {
            background-color: #2f855a;
            color: #fff;
        }

        .btn-buy:hover {
            background-color: #38a169;
        }

        .btn-buy:active {
            transform: scale(0.95);
        }

        .btn-sell {
            background-color: #c53030;
            color: #fff;
        }

        .btn-sell:hover {
            background-color: #e53e3e;
        }

        .btn-sell:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background-color: #4a5568;
            color: #fff;
            padding: 2px 8px;
            border: none;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s;
            margin-left: auto;
        }

        .btn-reset:hover {
            background-color: #718096;
        }

        @keyframes pulse-border {
            0% {
                background-color: rgba(229, 62, 62, 0.08);
            }

            50% {
                background-color: rgba(229, 62, 62, 0.16);
            }

            100% {
                background-color: rgba(229, 62, 62, 0.08);
            }
        }

        .empty-state {
            text-align: center;
            color: #718096;
            padding: 15px 0;
            font-style: italic;
        }

        .signal-bar {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .signal-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-green { background-color: #38a169; }
        .dot-yellow { background-color: #d69e2e; }
        .dot-red { background-color: #e53e3e; }
        .dot-gray { background-color: #4a5568; }

        .range-bar-bg {
            width: 50px;
            height: 4px;
            background: #2d3748;
            border-radius: 2px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 4px;
        }

        .range-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .sl-tp-info {
            font-size: 10px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .sl-tp-info span {
            white-space: nowrap;
        }

        .btn-ready {
            background-color: #2f855a;
            color: #fff;
        }

        .btn-ready:hover {
            background-color: #38a169;
        }

        .btn-near {
            background-color: #b7791f;
            color: #fff;
        }

        .btn-near:hover {
            background-color: #d69e2e;
        }

        .btn-far {
            background-color: #4a5568;
            color: #fff;
            opacity: 0.7;
        }

        .btn-far:hover {
            background-color: #718096;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>MicroScanner</h1>
            </div>
            <div class="wallet-panel">
                <div class="wallet-metric">
                    <span class="metric-label">Balance</span>
                    <span id="wallet-balance" class="metric-value value-neutral">$0.00</span>
                </div>
                <div class="wallet-metric">
                    <span class="metric-label">PNL</span>
                    <span id="wallet-pnl" class="metric-value value-neutral">0.00%</span>
                </div>
                <button class="btn-reset" onclick="resetWallet()">Reset</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="panel">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Entry</th>
                                <th>Current</th>
                                <th>Qty</th>
                                <th>Cost</th>
                                <th>PNL %</th>
                                <th>SL / TP</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="positions-tbody">
                            <tr>
                                <td colspan="8" class="empty-state">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="panel">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Mid Price</th>
                                <th>Imbalance</th>
                                <th>Signal</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="market-tbody">
                            <tr>
                                <td colspan="5" class="empty-state">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function manualBuy(symbol, price) {
            if (!confirm(`Force manual BUY of $10 for ${symbol}?`)) return;
            try {
                const res = await fetch('/api/simulate/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: symbol, price: price })
                });
                const data = await res.json();
                if (data.status === "error") alert(`Error: ${data.msg || data.message}`);
                updateDashboard();
            } catch (err) {
                console.error(err);
            }
        }

        async function manualSell(symbol, price) {
            if (!confirm(`Force manual SELL for ${symbol}?`)) return;
            try {
                const res = await fetch('/api/simulate/sell', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: symbol, price: price })
                });
                const data = await res.json();
                if (data.status === "error") alert(`Error: ${data.message}`);
                updateDashboard();
            } catch (err) {
                console.error(err);
            }
        }

        async function resetWallet() {
            if (!confirm("Reset wallet to $100? This will NOT close open positions.")) return;
            try {
                await fetch('/api/wallet/reset', { method: 'POST' });
                updateDashboard();
            } catch (err) {
                console.error(err);
            }
        }

        async function updateDashboard() {
            try {
                const resPositions = await fetch('/api/positions');
                const positions = await resPositions.json();
                const openSymbols = Object.keys(positions);

                const positionsTbody = document.getElementById('positions-tbody');
                if (openSymbols.length > 0) {
                    let positionsHtml = '';
                    for (const symbol in positions) {
                        const pos = positions[symbol];
                        const entryPrice = parseFloat(pos.entry_price_effective || pos.buy_price || 0);
                        const currentPrice = parseFloat(pos.current_price || 0);
                        const amount = parseFloat(pos.amount || 0);
                        const cost = parseFloat(pos.cost || 0);

                        let pnlText = "0.00%";
                        let pnlClass = "pnl-neutral";
                        let rowClass = "";
                        let riskBadge = "";

                        if (pos.unrealized_pnl !== null && pos.unrealized_pnl !== undefined) {
                            const pnl = parseFloat(pos.unrealized_pnl);
                            pnlText = `${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}%`;

                            if (pnl > 0) {
                                pnlClass = "pnl-positive";
                            } else if (pnl <= -0.35) {
                                pnlClass = "pnl-high-risk";
                                rowClass = "row-high-risk";
                                riskBadge = `<span class="badge-risk">Risk</span>`;
                            } else if (pnl < 0) {
                                pnlClass = "value-negative";
                            }
                        }

                        positionsHtml += `
                            <tr class="${rowClass}">
                                <td style="font-weight: 600; color: #fff;">${symbol} ${riskBadge}</td>
                                <td>${entryPrice.toFixed(4)}</td>
                                <td>${currentPrice > 0 ? currentPrice.toFixed(4) : '...'}</td>
                                <td>${amount.toFixed(5)}</td>
                                <td>$${cost.toFixed(1)}</td>
                                <td class="${pnlClass}">${pnlText}</td>
                                <td>
                                    <div class="sl-tp-info">
                                        <span style="color: #e53e3e;">SL: ${pos.stop_loss_price ? parseFloat(pos.stop_loss_price).toFixed(4) : '—'}</span>
                                        <span style="color: ${currentPrice > 0 && pos.stop_loss_price ? (currentPrice <= parseFloat(pos.stop_loss_price) ? '#e53e3e' : '#38a169') : '#718096'};">
                                            ${currentPrice > 0 && pos.stop_loss_price ? ((currentPrice / parseFloat(pos.stop_loss_price) - 1) * 100).toFixed(1) + '% to SL' : '—'}
                                        </span>
                                    </div>
                                </td>
                                <td>
                                    <button class="btn-action btn-sell" onclick="manualSell('${symbol}', ${currentPrice})">Sell</button>
                                </td>
                            </tr>
                        `;
                    }
                    positionsTbody.innerHTML = positionsHtml;
                } else {
                    positionsTbody.innerHTML = `<tr><td colspan="8" class="empty-state">No open positions</td></tr>`;
                }

                const response = await fetch('/api/status');
                const data = await response.json();

                const wallet = data.wallet || { balance: 0.0, pnl: 0.0 };
                document.getElementById('wallet-balance').innerText = `$${parseFloat(wallet.balance).toFixed(2)}`;

                const pnlElement = document.getElementById('wallet-pnl');
                const currentPnl = parseFloat(wallet.pnl);
                pnlElement.innerText = `${currentPnl >= 0 ? '+' : ''}${currentPnl.toFixed(2)}%`;

                if (currentPnl > 0) {
                    pnlElement.className = 'metric-value value-positive';
                } else if (currentPnl < 0) {
                    pnlElement.className = 'metric-value value-negative';
                } else {
                    pnlElement.className = 'metric-value value-neutral';
                }

                const marketTbody = document.getElementById('market-tbody');
                if (data.market && data.market.length > 0) {
                    let marketHtml = '';
                    const sortedMarket = data.market.sort((a, b) => a.symbol.localeCompare(b.symbol));

                    sortedMarket.forEach(item => {
                        const midPrice = (parseFloat(item.bid) + parseFloat(item.ask)) / 2;
                        const isAlreadyBought = openSymbols.includes(item.symbol);
                        const rowStyle = isAlreadyBought ? 'background-color: rgba(56, 161, 105, 0.15);' : '';

                        const high24h = parseFloat(item.high_24h) || 0;
                        const low24h = parseFloat(item.low_24h) || 0;
                        const range24hPct = high24h > low24h ? ((midPrice - low24h) / (high24h - low24h)) * 100 : 50;
                        const rangeColor = range24hPct <= 30 ? '#38a169' : range24hPct <= 50 ? '#d69e2e' : '#e53e3e';

                        const imbalanceOk = parseFloat(item.imbalance) >= 5;
                        const dirOk = item.price_direction === "UP";
                        const rangeOk = range24hPct <= 30;
                        const hasBalance = parseFloat(wallet.balance) >= 10;
                        const notHeld = !isAlreadyBought;

                        const conditionsMet = [imbalanceOk, dirOk, rangeOk, hasBalance, notHeld].filter(Boolean).length;
                        const canBuy = conditionsMet === 5;

                        let btnClass = 'btn-far';
                        let btnText = 'Wait';
                        if (canBuy && !isAlreadyBought) {
                            btnClass = 'btn-ready';
                            btnText = 'Buy';
                        } else if (conditionsMet >= 3 && !isAlreadyBought) {
                            btnClass = 'btn-near';
                            btnText = 'Near';
                        } else if (isAlreadyBought) {
                            btnClass = 'btn-far';
                            btnText = 'Held';
                        }

                        marketHtml += `
                            <tr style="${rowStyle}">
                                <td><span class="market-badge">${item.symbol}</span></td>
                                <td>${midPrice.toFixed(4)}</td>
                                <td style="font-weight: 500; color: ${imbalanceOk ? '#f56565' : '#cbd5e0'}">
                                    ${parseFloat(item.imbalance).toFixed(1)}x
                                </td>
                                <td>
                                    <div class="signal-bar">
                                        <span class="signal-dot ${imbalanceOk ? 'dot-green' : 'dot-red'}" title="Imbalance ${imbalanceOk ? 'OK' : 'Low'}"></span>
                                        <span class="signal-dot ${dirOk ? 'dot-green' : 'dot-red'}" title="Direction ${dirOk ? 'UP' : item.price_direction}"></span>
                                        <span class="signal-dot ${rangeOk ? 'dot-green' : 'dot-yellow'}" title="24h range ${range24hPct.toFixed(0)}%"></span>
                                        <span class="signal-dot ${hasBalance ? 'dot-green' : 'dot-red'}" title="Balance ${hasBalance ? 'OK' : 'Low'}"></span>
                                        <span class="signal-dot ${notHeld ? 'dot-green' : 'dot-gray'}" title="${notHeld ? 'Available' : 'Held'}"></span>
                                        <span class="range-bar-bg">
                                            <span class="range-bar-fill" style="width: ${Math.min(range24hPct, 100)}%; background: ${rangeColor};"></span>
                                        </span>
                                        <span style="font-size: 10px; color: ${rangeColor}; font-weight: 600;">${range24hPct.toFixed(0)}%</span>
                                    </div>
                                </td>
                                <td>
                                    <button class="btn-action ${btnClass}" onclick="manualBuy('${item.symbol}', ${midPrice})" ${isAlreadyBought ? 'disabled' : ''}>
                                        ${btnText}
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    marketTbody.innerHTML = marketHtml;
                } else {
                    marketTbody.innerHTML = `<tr><td colspan="5" class="empty-state">No market data available</td></tr>`;
                }
            } catch (error) {
                console.error("Error updating dashboard:", error);
            }
        }

        setInterval(updateDashboard, 1000);
        window.onload = () => updateDashboard();
    </script>
</body>

</html>
